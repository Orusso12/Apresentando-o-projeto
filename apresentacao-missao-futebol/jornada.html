<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container {
      width: 1280px;
      min-height: 720px;
      background: #0D2B26;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      padding: 48px 80px;
      position: relative;
    }

    .header {
      margin-bottom: 64px;
      padding-top: 0;
    }

    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .accent-bar {
      width: 64px;
      height: 6px;
      background: #B4F43A;
    }

    .flow-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: relative;
    }

    /* Connecting Line */
    .flow-line {
      position: absolute;
      top: 50%;
      left: 100px;
      right: 100px;
      height: 2px;
      background: #235A51;
      z-index: 1;
    }

    .flow-step {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 220px;
    }

    .step-icon {
      width: 80px;
      height: 80px;
      background: #153D36;
      border: 2px solid #235A51;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #B4F43A;
      font-size: 32px;
      margin-bottom: 24px;
      transition: border-color 0.3s;
    }

    .flow-step:hover .step-icon {
      border-color: #B4F43A;
    }

    .step-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      color: #FFFFFF;
      margin-bottom: 12px;
      text-align: center;
    }

    .step-desc {
      font-size: 14px;
      color: #9DBEB7;
      text-align: center;
      line-height: 1.4;
    }

    .footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .motif {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      color: #B4F43A;
      font-weight: 700;
    }

    .page-num {
      color: #9DBEB7;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="header">
      <h2>A jornada do usuário</h2>
      <div class="accent-bar"></div>
    </div>

    <div class="flow-container">
      <div class="flow-line"></div>
      
      <div class="flow-step">
        <div class="step-icon"><i class="fas fa-door-open"></i></div>
        <div class="step-title">Entrada</div>
        <div class="step-desc">Tela inicial com o título da missão e botão de acesso.</div>
      </div>

      <div class="flow-step">
        <div class="step-icon"><i class="fas fa-question"></i></div>
        <div class="step-title">Desafio</div>
        <div class="step-desc">Perguntas aleatórias com embaralhamento lógico.</div>
      </div>

      <div class="flow-step">
        <div class="step-icon"><i class="fas fa-comment-dots"></i></div>
        <div class="step-title">Feedback</div>
        <div class="step-desc">Resposta instantânea indicando acerto ou erro.</div>
      </div>

      <div class="flow-step">
        <div class="step-icon"><i class="fas fa-trophy"></i></div>
        <div class="step-title">Resultado</div>
        <div class="step-desc">Placar final e mensagem de desempenho personalizada.</div>
      </div>
    </div>

    <div class="footer">
      <div class="motif">/_</div>
      <div class="page-num">03</div>
    </div>
  </div>
</body>
</html>
